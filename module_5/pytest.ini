[pytest]
testpaths = tests
pythonpath = src
addopts = -q --cov=src --cov-report=term-missing --cov-fail-under=100
markers =
    web: Flask route and page tests
    buttons: Pull Data and Update Analysis behavior
    analysis: analysis labels and formatting
    db: database schema, insert, and query tests
    integration: end-to-end application flows
