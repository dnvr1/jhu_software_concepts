name: Module 5 security checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pylint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: module_5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pylint src --fail-under=10

  dependency-graph:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: module_5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: python -m pip install -r requirements.txt
      - run: python -m pydeps src/app.py --noshow -T svg -o dependency.svg
      - run: test -s dependency.svg
      - uses: actions/upload-artifact@v4
        with:
          name: module-5-dependency-graph
          path: module_5/dependency.svg

  snyk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: module_5
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: npm install --global snyk
      - name: Scan dependencies
        if: env.SNYK_TOKEN != ''
        run: snyk test --file=requirements.txt
      - name: Explain missing token
        if: env.SNYK_TOKEN == ''
        run: |
          echo "::error::Set the SNYK_TOKEN repository secret to run the required Snyk scan."
          exit 1

  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gradcafe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gradcafe_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/gradcafe_test
    defaults:
      run:
        working-directory: module_5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e .
      - run: python -m pytest -m "web or buttons or analysis or db or integration"
      - name: Verify restricted database role and live application
        shell: bash
        run: python tools/verify_least_privilege.py | tee database_privileges.txt
      - uses: actions/upload-artifact@v4
        with:
          name: module-5-database-privileges
          path: module_5/database_privileges.txt
